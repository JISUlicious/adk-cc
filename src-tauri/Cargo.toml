[package]
name = "adk-cc-desktop"
version = "0.1.0"
edition = "2021"
description = "adk-cc desktop shell"
authors = ["adk-cc"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
getrandom = "0.2"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Runtime Dock icon (macOS): the daily workflow runs the bare `cargo run`
# binary (README), which has no .app bundle for the .icns to live in — so
# the .jus mark never reached the Dock. These are already transitive deps
# of tauri; listing them adds only feature flags, no new crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
